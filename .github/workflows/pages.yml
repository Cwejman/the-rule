# Every commit on main is built into the surface's one published page and shipped to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time, and a deploy already running is let finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # the warnings are printed for whoever reads the run, and never stop the ship
      - name: Check
        run: bun poc/surface/surface.ts . --check
      - name: Build
        run: mkdir -p _site && bun poc/surface/surface.ts . --build _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # an image stands in a .img folder, which the artifact leaves out unless told
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
